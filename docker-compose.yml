services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe-postgres
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibe
    ports:
      - "5432:5432"
    volumes:
      - vibe_postgres:/var/lib/postgresql/data

volumes:
  vibe_postgres:
